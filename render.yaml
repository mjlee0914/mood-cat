# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 레포를 고르면 아래 설정대로 BE 서버를 만들어요.
services:
  - type: web
    name: mood-cat-api
    runtime: python
    plan: free                      # 무료: 15분 동안 요청이 없으면 잠들어요 😴
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14              # 로컬 .venv와 같은 버전
      # API 키는 여기에 적지 않아요! (sync: false = Render 화면에서 직접 입력)
      - key: OPENAI_API_KEY
        sync: false
      - key: GIPHY_API_KEY
        sync: false
